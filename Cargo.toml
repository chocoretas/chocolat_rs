[package]
name = "chocolat_rs"
version = "0.1.0"
description = "Chocotorta - A Discord bot ported from JS/Discord.js to Rust/Serenity"
authors = [
    "Mila Aldair <mila.gastelum@autisitici.org>",
    "Darksitomx, <leodarksi@proton.me>",
]
edition = "2021"

[dependencies]
reqwest = { version = "0.12", features = ["json"] }
serenity = { version = "0.12" }
songbird = { version = "0.5", default-features = true }
symphonia = { version = "0.5" }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-futures = "0.2"
async-trait = "0.1.89"
inventory = "0.3.24"
dotenvy = "0.15.7"
