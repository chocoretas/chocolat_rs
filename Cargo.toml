[package]
name = "chocolat_rs"
version = "0.1.0"
description = "Chocotorta - A Discord bot ported from JS/Discord.js to Rust/Serenity"
authors = [
    "Mila Aldair <mila.gastelum@autisitici.org>",
    "Darksitomx, <leodarksi@proton.me>",
]
edition = "2021"

[dependencies]
reqwest = { workspace = true }
serenity = { workspace = true }
songbird = { workspace = true, default-features = true }
symphonia = { workspace = true }
tokio = { workspace = true }
serde_json = "1"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-futures = { workspace = true }
